<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - RHU Health</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f6f9fb;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .offline-card {
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      max-width: 420px;
      width: 100%;
      border: 1px solid #e2e8f0;
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #eaf6fb;
      display: grid;
      place-items: center;
      color: #2778ad;
    }
    .offline-icon img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }
    h1 {
      font-size: 22px;
      color: #1e293b;
      margin-bottom: 10px;
    }
    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #2778ad;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d5c86;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">
      <img src="icon-192.png" alt="RHU Health Logo" onerror="this.style.display='none'">
    </div>
    <h1>You are currently offline</h1>
    <p>Please check your internet connection. Previously cached records and local data will sync automatically once reconnected.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
